name: Release

on:
  push:
    tags: ["v*"]

# Butuh contents:write untuk membuat GitHub Release
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Buat GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
